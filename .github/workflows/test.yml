name: test

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: "v2026.10.22"
          sha256: b1a4915ab9497dca0b9e6e29fba148da7d1c0903ca54a3d1f4ab80cb6650cbdc
      - name: pnpm install
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run build
        run: pnpm build
