name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
template: |
  ## What's Changed

  $CHANGES

# release-drafter v7: カテゴリの `label` は `when.label` に、
# 旧 `version-resolver` は各カテゴリの `semver-increment` に統合された
categories:
  - title: "💥 Breaking changes"
    semver-increment: major
    when:
      label: "breaking change"
  - title: "🚀 Features"
    semver-increment: minor
    when:
      label: feature
  - title: "☘️ Change specs"
    semver-increment: minor
    when:
      label: change
  - title: "🐛 Bug Fixes"
    semver-increment: patch
    when:
      label: bug
  - title: "📝 Chore"
    semver-increment: patch
    when:
      label: chore
  - title: "🎨 Renovate"
    semver-increment: patch
    when:
      label: renovate
  # どのカテゴリにも一致しない場合の既定（旧 version-resolver.default: patch）
  - type: version-resolver
    semver-increment: patch

autolabeler:
  - label: "breaking change"
    branch:
      - '/breaking\/.+/'
  - label: feature
    branch:
      - '/feature\/.+/'
  - label: change
    branch:
      - '/change\/.+/'
  - label: 'bug'
    branch:
      - '/fix\/.+/'
  - label: 'chore'
    branch:
      - '/chore\/.+/'
  - label: renovate
    branch:
      - '/renovate\/.+/'
